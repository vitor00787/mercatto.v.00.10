<!DOCTYPE html>
<!-- Mercadinho - vender.html - Formulario para anunciar produtos -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vender | Mercadinho</title>
    <link rel="icon" href="img/mercattô-favicon.jpg" type="image/svg+xml">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="vender">
    <header>
        <nav class="navbar navbar-expand-lg barra">
            <div class="container">
                <a class="navbar-brand marca" href="index.html">Mercadinho</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <form class="busca flex-grow-1 my-2 my-lg-0 mx-lg-4" id="formBusca" role="search">
                        <input class="form-control" type="search" id="campoBusca" placeholder="Buscar produtos" aria-label="Buscar produtos">
                    </form>
                    <ul class="navbar-nav align-items-lg-center gap-lg-1">
                        <li class="nav-item"><a class="nav-link" href="produtos.html">Categorias</a></li>
                        <li class="nav-item"><a class="nav-link" href="favoritos.html">Favoritos</a></li>
                        <li class="nav-item"><a class="nav-link active" href="vender.html">Vender</a></li>
                        <li class="nav-item"><a class="nav-link" id="linkEntrar" href="entrar.html">Entrar</a></li>
                        <li class="nav-item"><a class="nav-link" href="https://github.com" target="_blank" rel="noopener">GitHub</a></li>
                        <li class="nav-item"><a class="btn btn-verde ms-lg-2 mt-2 mt-lg-0" href="carrinho.html">Carrinho (<span class="contador-carrinho">0</span>)</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container py-4">
        <h1 class="h3 fw-bold mb-3">Vender um produto</h1>
        <div id="alertas"></div>
        <div class="row g-4">
            <section class="col-lg-7">
                <form id="formVenda" novalidate>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do produto</label>
                        <input type="text" class="form-control" id="nome" placeholder="Ex.: Fone Bluetooth" required minlength="3">
                    </div>
                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label for="preco" class="form-label">Preço (R$)</label>
                            <input type="number" class="form-control" id="preco" placeholder="0,00" required min="1" step="0.01">
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label for="categoria" class="form-label">Categoria</label>
                            <select class="form-select" id="categoria" required>
                                <option value="">Selecione</option>
                                <option>Eletrônicos</option>
                                <option>Moda</option>
                                <option>Casa</option>
                                <option>Esportes</option>
                                <option>Livros</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="vendedor" class="form-label">Nome da loja</label>
                        <input type="text" class="form-control" id="vendedor" placeholder="Ex.: Loja do João" required minlength="3">
                    </div>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" rows="4" placeholder="Conte os detalhes do produto" required minlength="20"></textarea>
                    </div>
                    <button type="submit" class="btn btn-verde">Anunciar produto</button>
                </form>
            </section>
            <section class="col-lg-5">
                <h2 class="h5 fw-bold">Meus anúncios</h2>
                <ul class="list-group" id="meusAnuncios"></ul>
            </section>
        </div>
    </main>
    <footer class="rodape mt-5 py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-3">
            <p class="mb-0">&copy; 2026 Mercadinho. Projeto acadêmico de Front-End Web.</p>
            <nav class="d-flex flex-wrap gap-3" aria-label="Rodapé">
                <a href="home.html">home</a>
                <a href="planos.html">Planos</a>
                <a href="contato.html">Contato</a>
                <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </footer>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
