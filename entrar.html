<!DOCTYPE html>
<!-- Mercadinho - entrar.html - Login e cadastro de usuarios com localStorage -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Mercattô</title>
    <link rel="icon" href="img/mercattô-favicon.jpg" type="image/svg+xml">
    <link rel="stylesheet" href="css/puro.css">
</head>
<body data-pagina="entrar">
    <header class="p-barra">
        <div class="p-container p-barra-fluxo">
            <a class="p-marca" href="index.html">Mercattô</a>
            <button class="p-toggler" id="botaoMenu" type="button" aria-label="Abrir menu" aria-expanded="false">&#9776;</button>
            <form class="p-busca" id="formBusca" role="search">
                <input class="p-campo" type="search" id="campoBusca" placeholder="Buscar produtos" aria-label="Buscar produtos">
            </form>
            <nav class="p-menu" id="menu" aria-label="Principal">
                <a href="produtos.html">Categorias</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="vender.html">Vender</a>
                <a id="linkEntrar" class="ativo" href="entrar.html">Entrar</a>
                <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
                <a class="p-carrinho" href="carrinho.html">Carrinho (<span id="contador">0</span>)</a>
            </nav>
        </div>
    </header>
    <main class="p-principal">
        <div class="p-container">
            <h1 class="p-titulo" style="text-align: center;">Sua conta</h1>
            <div class="p-painel">
                <div id="mensagem" class="p-alerta p-oculto" role="status"></div>
                <div class="p-abas" id="abas">
                    <button class="p-aba ativa" type="button" data-alvo="entrar">Entrar</button>
                    <button class="p-aba" type="button" data-alvo="cadastro">Criar conta</button>
                </div>
                <form id="formEntrar">
                    <label class="p-rotulo" for="loginEmail">E-mail</label>
                    <input class="p-campo" type="email" id="loginEmail" placeholder="voce@exemplo.com" required>
                    <label class="p-rotulo" for="loginSenha">Senha</label>
                    <input class="p-campo" type="password" id="loginSenha" placeholder="Sua senha" required minlength="6">
                    <p><button class="p-botao" type="submit" style="width: 100%;">Entrar</button></p>
                </form>
                <form id="formCadastro" class="p-oculto">
                    <label class="p-rotulo" for="cadNome">Nome completo</label>
                    <input class="p-campo" type="text" id="cadNome" placeholder="Seu nome" required minlength="3" pattern="[A-Za-zÀ-ÿ ]{3,}" title="Use apenas letras, com no mínimo 3 caracteres">
                    <label class="p-rotulo" for="cadEmail">E-mail</label>
                    <input class="p-campo" type="email" id="cadEmail" placeholder="voce@exemplo.com" required>
                    <label class="p-rotulo" for="cadSenha">Senha</label>
                    <input class="p-campo" type="password" id="cadSenha" placeholder="Mínimo de 6 caracteres" required minlength="6">
                    <p><button class="p-botao" type="submit" style="width: 100%;">Criar conta</button></p>
                </form>
                <div id="sessao" class="p-oculto">
                    <p>Você está conectado como <strong id="nomeSessao"></strong>.</p>
                    <button class="p-botao p-botao-perigo" type="button" id="botaoSair">Sair da conta</button>
                </div>
            </div>
        </div>
    </main>
    <footer class="p-rodape">
        <div class="p-container p-rodape-fluxo">
            <p style="margin: 0;">&copy; 2026 Mercattô. Projeto acadêmico de Front-End Web.</p>
            <nav aria-label="Rodapé">
                <a href="home.html">Home</a>
                <a href="planos.html">Planos</a>
                <a href="contato.html">Contato</a>
            </nav>
        </div>
    </footer>
    <script src="js/puro.js"></script>
</body>
</html>
